<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexEye Client — Device Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-card: rgba(18, 26, 43, 0.85);
            --border-color: rgba(66, 99, 153, 0.25);
            --primary: #00e5ff;
            --primary-glow: rgba(0, 229, 255, 0.25);
            --accent: #3b82f6;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 229, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 229, 255, 0.05);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(59, 130, 246, 0.2));
            border: 1px solid var(--primary);
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .brand-subtitle {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .master-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 14, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            margin-bottom: 24px;
        }

        .badge-status {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 12px 14px;
            color: #fff;
            font-size: 14px;
            font-family: monospace;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 10px;
            color: #050b14;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            opacity: 0.95;
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .alert-box {
            display: none;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .alert-error {
            background: var(--danger-bg);
            border: 1px solid var(--danger);
            color: #fca5a5;
        }

        .alert-success {
            background: var(--success-bg);
            border: 1px solid var(--success);
            color: #86efac;
        }

        .security-notice {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 11px;
            color: #64748b;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-logo">👁</div>
            <h1 class="brand-title">APEXEYE CLIENT</h1>
            <div class="brand-subtitle">Device Authentication</div>
        </div>

        <div class="master-badge">
            <span style="color: var(--text-dim);">Target Master:</span>
            <div class="badge-status">
                <span class="status-dot"></span>
                <span id="masterUrlDisplay">{{ master_url }}</span>
            </div>
        </div>

        <div id="alertBox" class="alert-box alert-error"></div>

        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label class="form-label" for="deviceId">Device ID</label>
                <input 
                    type="text" 
                    id="deviceId" 
                    class="form-input" 
                    placeholder="e.g. WIN-DEV-001" 
                    value="{{ default_device_id }}"
                    required 
                    autocomplete="off"
                    spellcheck="false"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="authToken">Authentication Token</label>
                <input 
                    type="password" 
                    id="authToken" 
                    class="form-input" 
                    placeholder="Enter Master-issued token" 
                    required 
                    autocomplete="off"
                    spellcheck="false"
                >
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <span>Authenticate & Connect</span>
            </button>
        </form>

        <div class="security-notice">
            🔒 <strong>Security Boundary</strong>: Obtain your Device ID and pairing token from the Master Administrator. Credentials are verified against the Master database.
        </div>
    </div>

    <script>
        async function handleAuth(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');
            const deviceId = document.getElementById('deviceId').value.trim();
            const authToken = document.getElementById('authToken').value.trim();

            if (!deviceId || !authToken) {
                showAlert('Device ID and Authentication Token are required.', true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span>Verifying with Master...</span>';
            alertBox.style.display = 'none';

            try {
                const response = await fetch('/api/local/authenticate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        device_id: deviceId,
                        token: authToken
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showAlert('✓ Authentication successful! Transitioning to Client Dashboard...', false);
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showAlert(data.error || 'Authentication failed. Verify credentials with Master admin.', true);
                    btn.disabled = false;
                    btn.innerHTML = '<span>Authenticate & Connect</span>';
                }
            } catch (err) {
                showAlert('Network error communicating with local agent service: ' + err.message, true);
                btn.disabled = false;
                btn.innerHTML = '<span>Authenticate & Connect</span>';
            }
        }

        function showAlert(msg, isError) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = 'alert-box ' + (isError ? 'alert-error' : 'alert-success');
            alertBox.textContent = msg;
            alertBox.style.display = 'block';
        }
    </script>
</body>
</html>
